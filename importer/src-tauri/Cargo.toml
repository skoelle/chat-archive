[package]
name = "takeout-message-importer"
version = "0.1.0"
description = "Extracts Instagram/Facebook takeout ZIPs and forwards them to chat-archive-api"
edition = "2021"

[lib]
name = "takeout_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
walkdir = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
