version: "3.9"

services:
  chat-archive-api:
    image: ghcr.io/skoelle/chat-archive-api:latest
    container_name: chat-archive-api
    restart: unless-stopped
    environment:
      API_TOKEN: "${API_TOKEN}"
      MYSQL_HOST: "${MYSQL_HOST:-mariadb}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-chatarchive}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-chatarchive}"
    ports:
      - "127.0.0.1:8420:8420"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8420/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:11.4
    container_name: chat-archive-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-chatarchive}"
      MYSQL_USER: "${MYSQL_USER:-chatarchive}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - chat-archive-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chat-archive-data:
